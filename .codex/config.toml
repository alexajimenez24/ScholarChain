# .codex/config.toml - project layer for Codex, loaded only after the human marks this
# project as trusted. Owner: factory-engineer (constitutional).
# Codex has no per-agent tool fences: custom agents inherit this sandbox, approval policy
# and MCP server list from the parent session, so every server here is read-only at the
# server level. Open review and test-audit sessions with `codex --sandbox read-only`.
# Before ratification, check every key here and in .codex/hooks.json with
# `codex exec --strict-config` on the installed Codex. Keys marked [PROPOSED - verify
# against harness docs] are schema-valid but their runtime behavior is not probed live.

# Orchestrator session default = the high tier (agents override it per .agents/models.json).
model = "gpt-6.2-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
hooks = true

# Concurrency cap for spawned role agents.
[agents]
max_concurrent_threads_per_session = 4

# Tool servers: the same servers, versions and read-only flags as .mcp.json.
# Secrets come only from the environment (bearer_token_env_var, env_vars), never values.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/readonly"
bearer_token_env_var = "GITHUB_PAT"
http_headers = { "X-MCP-Readonly" = "true", "X-MCP-Lockdown" = "true" }

[mcp_servers.aws-api]
command = "uvx"
args = ["awslabs.aws-api-mcp-server@1.6.1"]
# The profile is pinned to the view-only role, never forwarded, so the server can never
# fall back to the human's default credentials.
env = { AWS_REGION = "us-east-2", READ_OPERATIONS_ONLY = "true", REQUIRE_MUTATION_CONSENT = "true", AWS_API_MCP_TELEMETRY = "false", AWS_API_MCP_PROFILE_NAME = "scholarchain-readonly" }
# [PROPOSED - verify against harness docs] forwards these variables from the environment.
env_vars = ["HOME"]
# [PROPOSED - verify against harness docs] server-side tool allowlist.
enabled_tools = ["call_aws", "suggest_aws_commands"]

[mcp_servers.terraform]
command = "terraform-mcp-server"
args = ["stdio", "--toolsets=registry"]
env = { LOG_LEVEL = "error" }

[mcp_servers.aws-docs]
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@1.2.6"]
env = { FASTMCP_LOG_LEVEL = "ERROR", AWS_DOCUMENTATION_PARTITION = "aws" }
