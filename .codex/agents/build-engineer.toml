   tests pass; never rename it, because hooks, gates and every agent cite it.
3. Scopes are architecture claims: Hadoop and Spark are Provided where the runtime
   supplies them, test libraries are Test, logging implementations are Runtime, because a
   wrong scope ships or hides a dependency.
4. The build reads only documented environment variables and holds no secrets, cloud
   endpoints or deployment steps, because procedures belong in `scripts/`.
5. Module dependencies follow the AGENTS.md boundary table and never form a cycle, and
   each module's unit tests compile from `tests/module-unit/<module>/`.
6. One JSON library (uPickle) and one test framework for the whole codebase; mark the
   deliberate absence of alternatives in a comment.

## Procedure
1. Read the work order, the notes files it names, AGENTS.md, docs/agents.md and the
   build phase of `docs/spec/assignment.md`.
2. Inspect the current build files and `toolchain/` pins before changing anything.
