    update_strategy: "re-query per iD for each DBLP snapshot; the annual public data file is the full-scale alternative and needs an XML normalizer and the human's approval for its size"
    linkage_fields:
      - "orcid"
      - "work doi"
      - "name variants"
      - "employment organization"
