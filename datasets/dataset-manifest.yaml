    schema_version: "Crossref REST API message, message-version 1.0.0 as observed on 2026-11-22"
    subset_rule: "DOIs found in the DBLP subset, at most --max-dois (default 50, committed sample 25), one request per DOI; DOIs answering 404 are skipped and counted. Order sorted ascending by default; scale-up uses --doi-order hash: the 5000 DOIs with the smallest sha256(doi lower-case) among the 90285, so the 5000 are not biased by prefix"
    update_strategy: "re-query by DOI for each DBLP snapshot; the full-scale alternative is the Crossref public data file (https://www.crossref.org/services/metadata-retrieval/public-data-file/, not inspected)"
    linkage_fields:
      - "doi"
      - "title"
