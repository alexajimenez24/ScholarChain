# ScholarChain configuration, version config-v1.
#
# FORMAT RESTRICTION: this file is written in the JSON-compatible subset of YAML 1.2, that is,
# exactly one JSON document, so that uPickle (the only JSON library in the project) parses it.
# Allowed: JSON syntax and full-line "#" comments (the loader removes them before parsing).
# Not allowed: anchors, aliases, tags, multi-document files, block style, flow style that is not
# JSON, trailing commas, comments after a value.
#
# VALUES: a string of the form "${VAR}" or "${VAR:-default}" is replaced from the process
# environment. "${VAR}" without a default must be set, or the load fails. A whole-string
# placeholder whose default is a number or boolean is typed accordingly; otherwise it is a string.
# Any value can be overridden by an environment variable SCHOLARCHAIN__<SECTION>__<KEY> (nested
# keys joined with "__", case-insensitive), which beats the placeholder and the literal.
# No bucket name, endpoint, queue URL, AWS account ID, model ID or identity-provider value is
# written here; each comes from the environment. Empty is valid in local mode and rejected in aws
# mode. Secrets never belong in this file.
{
  "configVersion": "config-v1",
  "application": {
    "environment": "${SCHOLARCHAIN_ENV:-dev}",
    "region": "${AWS_REGION:-us-east-2}",
    "mode": "${SCHOLARCHAIN_MODE:-local}"
  },
  "storage": {
    "rawBucket": "${RAW_BUCKET:-}",
    "curatedBucket": "${CURATED_BUCKET:-}",
    "graphBucket": "${GRAPH_BUCKET:-}",
    "ragBucket": "${RAG_BUCKET:-}",
    "localRoot": "${SCHOLARCHAIN_LOCAL_ROOT:-target/local-run}"
  },
  "neptune": {
    "endpoint": "${NEPTUNE_ENDPOINT:-}",
    "port": "${NEPTUNE_PORT:-8182}",
    "queryTimeoutMs": 5000,
    "iamAuth": true
  },
  "dynamo": {
    "runLedgerTable": "${DDB_RUN_LEDGER:-}",
    "entityLinkCacheTable": "${DDB_ENTITY_LINK_CACHE:-}",
    "querySessionTable": "${DDB_QUERY_SESSION:-}",
    "evidenceBundleTable": "${DDB_EVIDENCE_BUNDLE:-}",
    "artifactRegistryTable": "${DDB_ARTIFACT_REGISTRY:-}",
    "researcherMetricTable": "${DDB_RESEARCHER_METRIC:-}"
  },
  "vectors": {
    "vectorBucket": "${VECTOR_BUCKET:-}",
    "indexes": {
      "researchers": "researcher-profile-v1",
      "communities": "collaboration-community-v1",
      "abstracts": "paper-abstract-v1",
      "paths": "collaboration-path-v1",
      "topicInstitutions": "topic-institution-summary-v1"
    },
    "dimension": "${EMBEDDING_DIMENSION:-256}"
  },
  "entityResolution": {
    "policyVersion": "er-v1",
    "acceptThreshold": 0.9,
    "rejectThreshold": 0.35,
    "llmBandMin": 0.7,
    "llmBandMax": 0.9,
    "maxBlockSize": 200,
    "maxLlmCallsPerRun": "${ER_MAX_LLM_CALLS:-0}"
  },
  "graph": {
    "policyVersion": "graph-v1",
    "metricVersion": "metrics-v1",
    "windows": [
      {"startYear": 1950, "endYear": 2026},
      {"startYear": 2000, "endYear": 2009},
      {"startYear": 2010, "endYear": 2014},
      {"startYear": 2015, "endYear": 2026}
    ],
    "maxTeamSizeForPairs": 300,
    "representativeWorkLimit": 5,
    "componentMaxIterations": 100,
    "communityIterations": 8,
    "betweennessSampleSources": 16,
    "betweennessSeed": 441,
    "kcoreMaxK": 64,
    "pathMaxDepth": 6
  },
  "retrieval": {
    "graphLimit": 100,
    "vectorLimit": 30,
    "maxPathDepth": 6,
    "contextTokenBudget": 12000,
    "fusionPolicyVersion": "fusion-v1"
  },
  "models": {
    "embeddingModel": "${EMBEDDING_MODEL_ID:-}",
    "synthesisModel": "${SYNTHESIS_MODEL_ID:-}",
    "verificationModel": "${VERIFICATION_MODEL_ID:-deterministic-verifier-v1}",
    "llmEnabled": "${LLM_ENABLED:-false}"
  },
  "operations": {
    "synchronousDeadlineMs": 15000,
    "maxWorkflowRetries": 2,
    "maxConcurrentLlmCalls": 4,
    "maxTokensPerQuery": 4000,
    "maxQuestionChars": 2000
  },
  "services": {
    "query": {
      "serviceName": "query-service",
      "port": "${QUERY_SERVICE_PORT:-8080}",
      "requestTimeoutMs": "${QUERY_REQUEST_TIMEOUT_MS:-15000}"
    },
    "graph": {
      "serviceName": "graph-service",
      "port": "${GRAPH_SERVICE_PORT:-8080}",
      "requestTimeoutMs": "${GRAPH_REQUEST_TIMEOUT_MS:-10000}"
    },
    "worker": {
      "serviceName": "embedding-worker",
      "port": "${WORKER_SERVICE_PORT:-8080}",
      "requestTimeoutMs": "${WORKER_REQUEST_TIMEOUT_MS:-30000}",
      "embeddingQueueUrl": "${EMBEDDING_QUEUE_URL:-}",
      "batchSize": "${WORKER_BATCH_SIZE:-10}",
      "maxInFlight": "${WORKER_MAX_IN_FLIGHT:-4}"
    },
    "auth": {
      "issuer": "${COGNITO_ISSUER:-}",
      "audience": "${COGNITO_AUDIENCE:-}",
      "jwksUrl": "${COGNITO_JWKS_URL:-}",
      "requestTimeoutMs": "${COGNITO_JWKS_TIMEOUT_MS:-3000}"
    }
  }
}
